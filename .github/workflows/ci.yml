name: SGI-AUTO — CI/CD Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build, Tests y Cobertura
  # ─────────────────────────────────────────────
  build-y-test:
    name: Build, Tests y Cobertura
    runs-on: ubuntu-latest

    # PostgreSQL de prueba para tests de integración futuros
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sgi_auto_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: ./mvnw clean compile -q

      - name: Ejecutar tests unitarios
        run: ./mvnw test
        env:
          # Los tests unitarios usan Mockito, no necesitan BD real
          # Pero si hay tests de integración futuros, usarán estas variables
          DATABASE_URL: jdbc:postgresql://localhost:5432/sgi_auto_test
          JWT_SECRET: clave_secreta_para_tests_de_integracion_256_bits_minimo_requerido
          JWT_EXPIRACION_HORAS: 1

      - name: Verificar cobertura con JaCoCo
          run: ./mvnw verify -DskipTests
          env:
            DATABASE_URL: jdbc:postgresql://localhost:5432/sgi_auto_test
            JWT_SECRET: clave_secreta_para_tests_ci_256_bits_minimo_requerido
            JWT_EXPIRACION_HORAS: 1

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Deploy a Railway (solo en push a main)
  # ─────────────────────────────────────────────
  deploy-railway:
    name: Deploy a Railway
    runs-on: ubuntu-latest
    needs: build-y-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a Railway
        run: railway up --service sgi-auto-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}